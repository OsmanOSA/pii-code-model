        - a former colleague recommends someone for an open position
        - a hiring manager asks a recruiter for feedback on a junior profile
        - a candidate negotiates remote days before signing
        - a recruiter asks whether a notice period can be shortened
        - an intern asks a former tutor for a reference
        - a recruiter apologises for mixing up two CVs
        - a candidate asks what to bring to an on-site technical test | logistics
