# Tables drawn from by datagen/briefs.py, for the cells of templates/plan.yaml with `briefs: true`.
# Kinds here are generic: `kinds` and `locale_kinds` turn them into the schema's kinds for a fill locale.
# Weights say what is plausible for a format: a kind absent from a format is never drawn for it.
record_share: 0.12            # share of templates with a full record: four kinds or more on one person
kind_count_weights: {1: 45, 2: 35, 3: 20}   # kinds per template, among those that are neither empty nor a record
mixed_locales: {fr_FR: 50, en_US: 25, en_GB: 25}
person_kinds: [name, email, phone, address, birth_date, national_id, tax_id, identity_card, passport, driving_licence, iban, bank_account, payment_card]

kinds:
  name: person_name
  email: email
  phone: phone
  birth_date: birth_date
  iban: iban
  bank_account: bank_account_number
  payment_card: payment_card
  card_code: card_security_code
  password: password
  opaque_token: opaque_token
  url_password: url_password
  private_key: private_key
  jwt: jwt
  api_key: [github_token, gitlab_token, slack_token, google_api_key, huggingface_token, npm_token, sendgrid_api_key, openai_api_key, anthropic_api_key, stripe_secret_key, aws_access_key_id]

locale_kinds:
  fr_FR:
    address: fr_postal_address
    national_id: fr_social_security_number
    tax_id: fr_tax_number
    identity_card: fr_identity_card
    passport: fr_passport
    driving_licence: fr_driving_licence
    plate: fr_license_plate
    company_id: [fr_siren, fr_siret]
  en_GB:
    address: postal_address
    national_id: uk_national_insurance_number
    passport: uk_passport
    driving_licence: uk_driving_licence
    plate: uk_license_plate
  en_US:
    address: postal_address
    national_id: us_ssn
    tax_id: us_itin
    passport: us_passport
    driving_licence: us_driver_license
    plate: us_license_plate

families:
  natural:
    no_indicator_share: 0.6
    accessory_share: 0.85
    record_tag: admin
    base_kinds: [name, phone, email]   # any text between people may hold these
    tag_boost: 10                      # a kind a tag brings weighs this much more: the situation is why it is there
    tag_kinds:                         # what a situation's tags add to them
      logistics: [address]
      vehicle: [plate]
      money: [iban, bank_account, company_id]
      access: [password, opaque_token]
      admin: [address, birth_date, national_id, tax_id, identity_card, passport, driving_licence, iban, bank_account]
    lengths:
      - {name: very short, lines: [1, 2], weight: 25}
      - {name: short, lines: [3, 6], weight: 40}
      - {name: medium, lines: [7, 15], weight: 25}
      - {name: long, lines: [16, 40], weight: 10}
    formats:
      SMS: {name: 7, phone: 5, address: 4, plate: 2, password: 1, iban: 1, email: 1, birth_date: 1}
      chat message: {name: 8, phone: 4, email: 3, address: 3, iban: 2, password: 3, plate: 1, birth_date: 1, opaque_token: 1}
      LinkedIn message: {name: 8, email: 5, phone: 5, address: 1, company_id: 2, birth_date: 1}
      informal email: {name: 8, email: 5, phone: 5, address: 4, iban: 3, birth_date: 2, national_id: 1, company_id: 2, bank_account: 1, identity_card: 1, passport: 1, driving_licence: 1, plate: 1, password: 1}
      forum post: {name: 2, email: 3, phone: 3, address: 2, plate: 3, password: 1, iban: 1, company_id: 1}
      social media comment: {name: 5, phone: 2, email: 2, address: 1, plate: 1}
    record_formats: [informal email, chat message, LinkedIn message]
    domain_formats:
      recruiting: [LinkedIn message, informal email, chat message, SMS]
      freelance missions: [LinkedIn message, informal email, chat message, SMS]
      sales prospecting: [LinkedIn message, informal email, SMS]
      networking: [LinkedIn message, informal email, chat message]
      personal life: [SMS, chat message, informal email, social media comment]
      customer support: [informal email, chat message, social media comment, forum post]
      community: [forum post, chat message, social media comment, informal email, SMS]
    positions:
      - opening sentence
      - middle of a sentence
      - after the main point, as an afterthought
      - last line before the sign-off
      - {text: P.S., not: [SMS, chat message, social media comment]}
      - a short list of practical details
    reasons:   # fits: covers every kind; key: one kind is its point; needs: a tag of the situation; not: formats it cannot be
      - {text: so the reader can reach them or someone else, fits: [name, phone, email], key: [phone, email], weight: 4}
      - {text: passes on a third person's contact, fits: [name, phone, email], key: [phone, email]}
      - {text: a person is named in passing while the message is about something else, fits: [name], role: accessory, weight: 6}
      - {text: signature added out of habit, fits: [name, phone, email, address, company_id], role: accessory, position: signature, not: [SMS, chat message, social media comment]}
      - {text: "practical detail for a meeting, a delivery or a visit", fits: [name, address, phone], key: [address, phone], needs: logistics, weight: 5}
      - {text: money has to change hands, fits: [name, iban, bank_account], key: [iban, bank_account], needs: money}
      - {text: shares an access code with someone they trust, fits: [name, password, opaque_token, phone], key: [password, opaque_token], needs: access}
      - {text: identifies a car in a small everyday problem, fits: [name, plate, phone], key: [plate], needs: vehicle}
      - {text: a form or an office asked for it, fits: [name, birth_date, national_id, tax_id, identity_card, passport, driving_licence, company_id, bank_account, iban, address], key: [birth_date, national_id, tax_id, identity_card, passport, driving_licence, bank_account, iban], needs: admin, role: central}
      - {text: a date of birth matters for a practical reason, fits: [name, birth_date], key: [birth_date], needs: admin}
      - {text: company details needed for an invoice or a contract, fits: [name, company_id, address, iban, email], key: [company_id], needs: money}
      - {text: quoted from an earlier message, role: accessory, weight: 1, position: a quoted earlier message, not: [SMS, social media comment]}
      - {text: pasted with something else by mistake, role: accessory, weight: 1}
    record_reasons:
      - sends everything an office or an employer asked for
      - gives someone what they need to act on the writer's behalf
      - answers a request for details in one go
      - forwards a person's details to a colleague or a relative
    empty_reasons:
      - nobody is identified, the text only speaks of teams, roles or groups
      - a given name appears as an ordinary word, a place or a product
      - {text: "a word like contact, mail or number appears with no value after it", indicator: present}
      - the writer keeps the details for a private message
      - a company, brand or tool carrying a family name is mentioned
      - only a city, an age or an ordinary date appears
    situations:
      recruiting:
        - a recruiter proposes a product manager role to someone settled in their job for years
        - a candidate asks why they heard nothing after a second interview
        - a recruiter moves an interview because the hiring manager is ill | logistics
