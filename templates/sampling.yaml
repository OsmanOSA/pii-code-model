    formats:
      README .md: {name: 5, email: 5, password: 3, url_password: 3, opaque_token: 3, api_key: 3, private_key: 1, phone: 1}
      ticket: {name: 8, email: 6, phone: 5, address: 4, birth_date: 2, national_id: 2, iban: 2, payment_card: 1, plate: 1, opaque_token: 1, password: 1, identity_card: 1, passport: 1, driving_licence: 1, tax_id: 1}
      formal email: {name: 8, email: 6, phone: 6, address: 5, iban: 3, birth_date: 2, national_id: 2, company_id: 3, tax_id: 1, identity_card: 1, driving_licence: 1, passport: 1, payment_card: 1}
      commit message: {name: 8, email: 7, opaque_token: 2, api_key: 2, password: 1, url_password: 1}
      pull request description: {name: 7, email: 4, opaque_token: 3, api_key: 3, password: 2, url_password: 2, private_key: 1, jwt: 1}
      meeting notes: {name: 9, email: 3, phone: 3, address: 2, birth_date: 1, password: 2, iban: 1}
      wiki page: {name: 6, email: 4, phone: 3, password: 3, url_password: 3, opaque_token: 3, api_key: 2, private_key: 2, address: 1}
      incident report: {name: 7, email: 4, phone: 3, opaque_token: 3, jwt: 2, password: 2, url_password: 2, iban: 1, payment_card: 1, address: 1}
    record_formats: [ticket, formal email]
    positions:
      - title or subject line
      - first paragraph
      - a quoted log or error message
      - a code block or a command
      - a bullet in a list
      - {text: a table row, not: [commit message]}
      - a trailer or a signature
      - a closing remark
      - a link or a URL
    reasons:
      - {text: "the person who reported, approved or owns the work", fits: [name, email], weight: 5}
      - {text: the contact to call if something goes wrong, fits: [name, phone, email], key: [phone], not: [commit message]}
      - {text: quoted from a customer's message, fits: [name, email, phone, address, birth_date, iban, payment_card], not: [README .md, commit message, pull request description, wiki page]}
      - {text: a real record pasted to reproduce a bug, needs: admin, not: [README .md, formal email, meeting notes]}
      - {text: left in a command or a sample by mistake, fits: [name, email, password, url_password, opaque_token, api_key, private_key, jwt], key: [password, url_password, opaque_token, api_key, private_key, jwt], role: accessory, not: [formal email, meeting notes]}
      - {text: setup instructions that include the credentials, fits: [name, email, password, url_password, opaque_token, api_key, private_key], key: [password, url_password, opaque_token, api_key, private_key, jwt], not: [commit message, ticket, formal email, incident report]}
      - {text: a credential shared so a colleague can get on with the work, fits: [name, email, password, url_password, opaque_token, api_key, jwt], key: [password, url_password, opaque_token, api_key, private_key, jwt], not: [README .md, commit message]}
      - {text: needed to identify the file being discussed, fits: [name, national_id, tax_id, identity_card, passport, driving_licence, plate, company_id, iban], key: [national_id, tax_id, identity_card, passport, driving_licence, plate, company_id, iban], not: [README .md, commit message, pull request description, wiki page]}
      - {text: a signature block added by the mail client, fits: [name, email, phone, address, company_id], role: accessory, position: a trailer or a signature, not: [README .md, commit message, pull request description, meeting notes, wiki page, incident report]}
      - {text: a commit or review trailer, fits: [name, email], key: [email], role: accessory, position: a trailer or a signature, not: [README .md, ticket, formal email, meeting notes, wiki page, incident report]}
      - {text: mentioned in passing while the text is about something else, role: accessory, weight: 1}
    record_reasons:
      - a customer's whole file is quoted to explain the case
      - the record was copied from the back office to reproduce a problem
