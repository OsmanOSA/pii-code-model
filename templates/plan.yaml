# Round 1 generation plan: one entry per session (docs/data-pipeline.md#coverage-matrix).
# 2,380 templates. The 12 cells up to tabular-fr-01 (1,830 templates) were written with a minimum per kind.
# The 8 cells with `briefs: true` (550 templates, about a quarter holding no entity) follow briefs drawn by
# `python -m datagen briefs`, which decide each template's situation, kinds, length and placement.
# A session generates one entry in batches of 20 with prompts/template-generation.md, and
# `python -m datagen progress` records each batch in templates/progress.yaml.
round: 1
cells:
  # code: 750
  - cell_id: code-fr-01
    family: code
    formats: [.py, .sql, .ipynb, .sh]
    language: fr
    fill_locale: fr_FR
    domains: [healthcare, banking, HR, energy, public administration, insurance]
    templates: 150
    pii_free_templates: 38
    kinds_to_cover: [fr_social_security_number, fr_tax_number, fr_siret, iban, fr_postal_address, birth_date, password, url_password, private_key, opaque_token]
    focus: Python services, data scripts and notebooks; SQL migrations, seeds and ad hoc queries; shell scripts of operations teams.
  - cell_id: code-fr-02
    family: code
    formats: [.js, .ts, .java, .php, .kt]
    language: fr
    fill_locale: fr_FR
    domains: [e-commerce, logistics, education, real estate, telecom, travel]
    templates: 150
    pii_free_templates: 38
    kinds_to_cover: [payment_card, card_security_code, stripe_secret_key, jwt, fr_identity_card, fr_passport, fr_license_plate, fr_siren, google_api_key, sendgrid_api_key, phone]
    focus: Web back ends and front ends, Android apps, Spring services; fixtures, mocks and API clients.
  - cell_id: code-en-01
    family: code
    formats: [.py, .sql, .ipynb, .sh]
    language: en
    fill_locale: en_US
    domains: [healthcare, fintech, insurance, government, SaaS, retail]
    templates: 150
    pii_free_templates: 38
    kinds_to_cover: [us_ssn, us_itin, us_passport, us_license_plate, postal_address, bank_account_number, aws_access_key_id, aws_secret_access_key, openai_api_key, anthropic_api_key, huggingface_token]
    focus: Data pipelines, ML notebooks calling model APIs, Django and FastAPI services, SQL analytics.
  - cell_id: code-en-02
    family: code
    formats: [.js, .ts, .java, .go, .cs, .rb]
    language: en
    fill_locale: en_GB
    domains: [logistics, e-commerce, education, media, travel, energy]
    templates: 150
    pii_free_templates: 38
    kinds_to_cover: [uk_national_insurance_number, uk_driving_licence, uk_passport, uk_license_plate, iban, github_token, npm_token, slack_token, jwt, payment_card]
    focus: Node and TypeScript services, Go and .NET back ends, Rails apps; tests, seeds and CI helpers.
  - cell_id: code-mixed-01
    family: code
    formats: [.py, .ts, .sql, .java, .ipynb]
    language: mixed
    fill_locale: mixed
    domains: [banking, healthcare, e-commerce, HR, SaaS, logistics]
    templates: 150
    pii_free_templates: 38
    kinds_to_cover: [fr_postal_address, fr_social_security_number, us_ssn, iban, gitlab_token, private_key, opaque_token, password, birth_date, url_password]
    focus: English code and comments handling French customer data, and the reverse.
